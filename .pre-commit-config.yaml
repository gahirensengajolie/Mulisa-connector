# Runs on every `git commit` (installed by `make setup`). Uses the tools in .venv, so versions
# always match CI.
repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy app
        language: system
        pass_filenames: false
        types: [python]
